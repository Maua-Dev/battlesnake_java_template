name: Tests and Deploy

on:
  push:
    branches:
      - '**'

jobs:

  ExecuteTests:

        name: ExecuteTests
        runs-on: ubuntu-latest
        
        steps:

            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
               distribution: 'temurin'
               java-version: '17'
               cache: 'maven'

            - name: Run Tests
              run: mvn test

  BootstrapBucketCreation:
    name: Bootstrap
    runs-on: ubuntu-latest
    needs: ExecuteTests
    if: github.ref_name == 'dev'

    outputs:
      s3_bucket_name: ${{ steps.bootstrap.outputs.s3_bucket_name }}
      dynamo_table_name: ${{ steps.bootstrap.outputs.dynamo_table_name }}

    steps:
      # Shared family TF backend is created once by template maintainers
      # (terraform/bootstrap). Participant repos only resolve the names —
      # scoped OIDC roles must not terraform-apply the shared buckets.
      - name: Resolve shared TF backend
        id: bootstrap
        run: |
          echo "s3_bucket_name=battlesnake-java-template-terraform-state-tfstate-new-account" >> "$GITHUB_OUTPUT"
          echo "dynamo_table_name=battlesnake-java-template-terraform-locks-tfstate-new-account" >> "$GITHUB_OUTPUT"

  build_java:
    name: Build Java Application
    runs-on: ubuntu-latest
    needs: BootstrapBucketCreation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build Java project with Maven
        run: mvn clean package 

      - name: Upload JAR as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: battlesnake-lambda-jar 
          path: target/battlesnake-lambda-1.0.jar


  deploy_app:
    name: 'Deploy | Deploy Application'
    runs-on: ubuntu-latest
    needs: [BootstrapBucketCreation, build_java] 

    permissions:      
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: ./terraform/app 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: battlesnake-lambda-jar 
          path: target

      - name: 'Configure AWS Credentials'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: 'us-east-1'
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-action-terraform-deploy

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6 
          cli_config_credentials_token: ${{ secrets.TFE_API_TOKEN }}
      
      - name: Terraform Init with Dynamic Backend
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_SLUG="${REPO_NAME//_/-}"
          echo "Repo: $REPO_NAME (slug: $REPO_SLUG)"
          # Must match IAM app/${REPO_SLUG}/* object prefix on the scoped OIDC role
          APP_TERRAFORM_KEY="app/${REPO_SLUG}/terraform.tfstate"
          echo "Key para o bucket: $APP_TERRAFORM_KEY"

          terraform init \
            -backend-config="bucket=${{ needs.BootstrapBucketCreation.outputs.s3_bucket_name }}" \
            -backend-config="dynamodb_table=${{ needs.BootstrapBucketCreation.outputs.dynamo_table_name }}" \
            -backend-config="key=$APP_TERRAFORM_KEY"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
          -var="project_name=${{ github.event.repository.name }}" \
          -var="environment=dev" \
